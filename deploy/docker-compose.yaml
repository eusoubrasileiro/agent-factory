# Factory Scrumban Board — static-site container
#
# Deploys from /opt/app/factory/deploy/, which is a checkout of this repo.
# Serves the rendered board over nginx:alpine, fronted by the shared Traefik
# proxy with HTTPS (ACME via Cloudflare DNS-only) and HTTP Basic Auth.
#
# `name:` is load-bearing. Compose derives the project name from the directory
# holding this file, so without the pin the project would be called `deploy`.
# It must keep matching the name the running container already carries.
name: factory

services:
  factory-board:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      # `../public`, NOT `./public`. This file lives in deploy/, so a bare
      # `./public` resolves to deploy/public — a directory nothing writes. nginx
      # would start perfectly healthy and serve 404s at every path.
      #
      # The publish funnel (scripts/board-autopublish.mjs) rsyncs to
      # deploy-host:/opt/app/factory/public/ — that path is its hardcoded
      # DEFAULT_REMOTE_DIR and its tests assert it. Since the checkout root IS
      # /opt/app/factory, `../public` resolves to exactly that target, and
      # the publisher needs no change.
      #
      # Recurring publish does NOT restart this container: the bind mount picks
      # up whatever rsync writes. public/ is gitignored — it is published output,
      # not source, and a `git clean -fd` here would erase the live board.
      - ../public:/usr/share/nginx/html:ro
    networks:
      - network_public
    labels:
      - traefik.enable=true
      # Operator board (everything EXCEPT /cliente): engineering telemetry.
      # Users: andre (+operator when provisioned). Tenant A's creds must NOT open this.
      - traefik.http.routers.factory.rule=Host(`factory.example.com`) && !PathPrefix(`/cliente`)
      - traefik.http.routers.factory.entrypoints=websecure
      - traefik.http.routers.factory.tls.certresolver=myresolver
      - traefik.http.routers.factory.middlewares=factory-auth
      - traefik.http.middlewares.factory-auth.basicauth.users=${FACTORY_BASICAUTH}
      # Client view (/cliente): the plain-PT funnel page rendered by
      # scripts/client-view.mjs — the ONLY path a client credential opens (D-30
      # narrowed 2026-07-14). Separate realm, separate user string.
      # FACTORY_CLIENT_BASICAUTH holds tenant-a + andre ($ doubled to $$, same rule).
      - traefik.http.routers.factory-cliente.rule=Host(`factory.example.com`) && PathPrefix(`/cliente`)
      - traefik.http.routers.factory-cliente.entrypoints=websecure
      - traefik.http.routers.factory-cliente.tls.certresolver=myresolver
      - traefik.http.routers.factory-cliente.middlewares=factory-cliente-auth
      - traefik.http.middlewares.factory-cliente-auth.basicauth.users=${FACTORY_CLIENT_BASICAUTH}
      - traefik.http.services.factory.loadbalancer.server.port=80
      - traefik.docker.network=network_public
networks:
  network_public:
    external: true
